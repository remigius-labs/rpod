<!doctype html>
<html><head><meta charset="utf-8"><title>RPod pixel editor</title>
<style>
  :root { --ink:#c4b5a0; --hot:#fff1dc; --dim:#6b5f52; --bg:#0b0907; --cell:#16120e; }
  body { background:var(--bg); color:var(--ink); font-family:"JetBrains Mono",monospace; margin:24px; font-size:13px; }
  h1 { font-size:16px; color:var(--hot); font-weight:normal; margin:0 0 14px; }
  h1 a { color:var(--dim); text-decoration:none; margin-left:14px; }
  h1 a.on { color:var(--hot); }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; min-height:30px; }
  button { font:inherit; color:var(--ink); background:var(--cell); border:1px solid var(--dim); border-radius:999px; padding:5px 14px; cursor:pointer; }
  button.on, button:hover { color:var(--hot); border-color:var(--ink); }
  .swatch { width:16px; height:16px; display:inline-block; vertical-align:-3px; border:1px solid var(--dim); margin-right:6px; }
  #save { border-color:var(--ink); }
  #status { color:var(--dim); min-width:16ch; }
  #grid { display:block; cursor:crosshair; touch-action:none; }
  .work { display:flex; gap:32px; align-items:flex-start; flex-wrap:nowrap; }
  .work > div:first-child { flex:none; }
  .work .help { max-width:var(--gridw); }
  .preview { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; flex-direction:column; }
  .preview figure { margin:0; }
  .preview canvas { display:block; image-rendering:pixelated; }
  figcaption { color:var(--dim); margin-top:6px; }
  .help { color:var(--dim); margin-top:10px; }
  [hidden] { display:none !important; }
</style></head><body>
<h1>[ RPod pixel editor ]<a href="/?asset=logo" id="tab-logo">logo</a><a href="/?asset=frame" id="tab-frame">frame</a><a href="/?asset=repeat" id="tab-repeat">repeat</a><a href="/?asset=shuffle" id="tab-shuffle">shuffle</a><a href="/?asset=repeat-one" id="tab-repeat-one">repeat one</a><a href="/?asset=moon" id="tab-moon">moon</a><a href="/?asset=delete" id="tab-delete">delete</a><a href="/?asset=note" id="tab-note">note</a><a href="/?asset=theme" id="tab-theme">theme</a><a href="/?asset=files" id="tab-files">files</a><a href="/?asset=bookmark" id="tab-bookmark">bookmark</a></h1>
<div class="bar">
  <span id="colours"></span>
  <span id="widthctl"><span>width</span> <button id="wminus">−</button> <span id="wval"></span> <button id="wplus">+</button></span>
  <button id="undo">undo</button>
  <button id="save">save to iPod sim</button>
  <span id="status"></span>
</div>
<div class="work">
<div><canvas id="grid"></canvas>
<div class="help">click toggles a pixel in the chosen colour · drag keeps painting or erasing · ctrl+z undo · ctrl+s save</div></div>
<div class="preview">
  <figure><canvas id="pv"></canvas><figcaption id="pvcap"></figcaption></figure>
  <figure><canvas id="pv1"></canvas><figcaption>actual size</figcaption></figure>
</div>
</div>
<script>
const ASSETS = ["logo", "frame", "repeat", "shuffle", "repeat-one", "moon", "delete", "note", "theme", "files", "bookmark"];
const ASSET = ASSETS.includes(new URLSearchParams(location.search).get("asset")) ? new URLSearchParams(location.search).get("asset") : "logo";
const ICON = !["logo", "frame"].includes(ASSET);
const CELL = ASSET === "logo" ? 20 : ASSET === "frame" ? 6 : 28;
const GOLD = [201, 162, 79], HI = [240, 212, 136], LOW = [59, 42, 20];
let W = 0, H = 0, palette = [], cells = [], colour = 1, painting = null, history = [];
const grid = document.getElementById("grid"), g = grid.getContext("2d");
const pv = document.getElementById("pv"), p = pv.getContext("2d");
const pv1 = document.getElementById("pv1"), p1 = pv1.getContext("2d");
const status = t => document.getElementById("status").textContent = t;
const img = src => { const i = new Image(); i.onload = drawPreview; i.src = src; return i; };
const backdrop = img("/backdrop"), cover = ASSET === "frame" ? img("/cover") : null;
const MENU = ["moon", "delete", "note", "theme", "files", "bookmark"].includes(ASSET);  /* preview = the Now Playing context menu, the icon live in its row */
const MENU_ROW = { moon: 0, note: 4, delete: 5, theme: 3, files: 4, bookmark: 1 }[ASSET] ?? 0;
const menuimg = MENU ? img("/menu?sel=" + MENU_ROW + ({ theme: "&menu=settings", files: "&menu=main", bookmark: "&menu=main" }[ASSET] || "")) : null;
document.getElementById("tab-" + ASSET).classList.add("on");
document.getElementById("widthctl").hidden = ASSET !== "logo";
document.getElementById("pvcap").textContent = ASSET === "logo" ? "title bar at 2x, gilded as saved" : MENU ? "context menu at 2x, this row selected" : ICON ? "gilded as saved, 8x" : "menu at 2x with a cover";

// Preview geometry: the asset's spot on the 320x240 screen and the area shown around it
const VIEW = ASSET === "logo" ? { x: 0, y: 0, w: 320, h: 30 } : MENU ? { x: 0, y: 28, w: 240, h: 136 } : ICON ? { x: 0, y: 0, w: 16, h: 16 } : { x: 180, y: 28, w: 140, h: 132 };
const PVSCALE = MENU ? [2, 1] : ICON ? [8, 2] : [2, 1];
for (const [c, s] of [[pv, PVSCALE[0]], [pv1, PVSCALE[1]]]) { c.width = VIEW.w * s; c.height = VIEW.h * s; }

function drawGrid() {
  grid.width = W * CELL; grid.height = H * CELL;
  document.documentElement.style.setProperty("--gridw", grid.width + "px");
  g.fillStyle = "#16120e"; g.fillRect(0, 0, grid.width, grid.height);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = cells[y * W + x];
    g.fillStyle = c ? palette[c] : ((x + y) % 2 ? "#1c1712" : "#211b15");
    g.fillRect(x * CELL + 1, y * CELL + 1, CELL - 1, CELL - 1);
  }
  document.getElementById("wval").textContent = W;
  drawPreview();
}

// Same rule as icons.py "gilt": dark ring outside, gold body, light on top/left edges
function gilt() {
  const on = (x, y) => x >= 0 && y >= 0 && x < W && y < H && cells[y * W + x];
  const px = new Map();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (on(x, y))
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (!on(x + dx, y + dy)) px.set((x + dx) + "," + (y + dy), LOW);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (on(x, y))
    px.set(x + "," + y, (!on(x - 1, y) || !on(x, y - 1)) ? HI : GOLD);
  return px;
}

function drawPreview() {
  if (!W) return;
  for (const [ctx, s] of [[p, PVSCALE[0]], [pv1.getContext("2d"), PVSCALE[1]]]) {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = "#120d0a"; ctx.fillRect(0, 0, VIEW.w * s, VIEW.h * s);
    if (MENU) {
      ctx.imageSmoothingEnabled = false;
      if (menuimg.naturalWidth) ctx.drawImage(menuimg, VIEW.x, VIEW.y, VIEW.w, VIEW.h, 0, 0, VIEW.w * s, VIEW.h * s);
      const cx = 1 + 1 - Math.min(...[...gilt().keys()].map(k => +k.split(",")[0])), cy = 30 + MENU_ROW * 22 - VIEW.y + Math.floor((16 - H) / 2);
      for (const [k, c] of gilt()) { const [x, y] = k.split(",").map(Number); ctx.fillStyle = `rgb(${c})`; ctx.fillRect((cx + x) * s, (cy + y) * s, s, s); }
      continue;
    }
    if (ICON) {
      for (const [k, c] of gilt()) { const [x, y] = k.split(",").map(Number); ctx.fillStyle = `rgb(${c})`; ctx.fillRect((x + Math.floor((16 - W) / 2)) * s, (y + Math.floor((16 - H) / 2)) * s, s, s); }
      continue;
    }
    if (backdrop.naturalWidth) ctx.drawImage(backdrop, VIEW.x, VIEW.y, VIEW.w, VIEW.h, 0, 0, VIEW.w * s, VIEW.h * s);
    if (ASSET === "logo") {
      ctx.fillStyle = "#fff1dc"; ctx.fillRect(0, 25 * s, 320 * s, 2 * s);
      const ox = Math.floor((320 - W) / 2), oy = 2;
      for (const [k, c] of gilt()) {
        const [x, y] = k.split(",").map(Number);
        if (y < 0 || y >= H) continue;
        ctx.fillStyle = `rgb(${c})`; ctx.fillRect((ox + x) * s, (oy + y) * s, s, s);
      }
    } else {
      const ox = 196 - VIEW.x, oy = 36 - VIEW.y;
      if (cover && cover.naturalWidth) ctx.drawImage(cover, (ox + 8) * s, (oy + 8) * s, 100 * s, 100 * s);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const c = cells[y * W + x];
        if (c) { ctx.fillStyle = palette[c]; ctx.fillRect((ox + x) * s, (oy + y) * s, s, s); }
      }
    }
  }
}

function cellAt(e) {
  const r = grid.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / CELL), y = Math.floor((e.clientY - r.top) / CELL);
  return x >= 0 && y >= 0 && x < W && y < H ? y * W + x : -1;
}
function paint(e) {
  const i = cellAt(e);
  if (i < 0 || cells[i] === painting) return;
  cells[i] = painting; drawGrid(); status("unsaved");
}
grid.addEventListener("pointerdown", e => {
  const i = cellAt(e);
  if (i < 0) return;
  history.push({ W, cells: cells.slice() });
  painting = cells[i] === colour ? 0 : colour;
  grid.setPointerCapture(e.pointerId); paint(e);
});
grid.addEventListener("pointermove", e => { if (painting !== null) paint(e); });
grid.addEventListener("pointerup", () => painting = null);

function resize(nw) {
  if (nw < 8 || nw > 200) return;
  history.push({ W, cells: cells.slice() });
  const n = new Array(nw * H).fill(0);
  for (let y = 0; y < H; y++) for (let x = 0; x < Math.min(W, nw); x++) n[y * nw + x] = cells[y * W + x];
  W = nw; cells = n; drawGrid(); status("unsaved");
}
function undo() { const s = history.pop(); if (s) { W = s.W; cells = s.cells; drawGrid(); status("unsaved"); } }
async function save() {
  status("saving…");
  const r = await fetch("/save?name=" + ASSET, { method: "POST", body: JSON.stringify({ w: W, h: H, cells }) });
  status(r.ok ? "saved, sim restarted" : "save failed");
}
function colourButtons() {
  const box = document.getElementById("colours");
  box.innerHTML = "";
  if (palette.length < 3) return;
  palette.forEach((hex, i) => {
    if (!i) return;
    const b = document.createElement("button");
    b.innerHTML = `<span class="swatch" style="background:${hex}"></span>${i === 1 ? "cream" : "dark"}`;
    b.classList.toggle("on", i === colour);
    b.onclick = () => { colour = i; colourButtons(); };
    box.appendChild(b);
  });
}
document.getElementById("wminus").onclick = () => resize(W - 1);
document.getElementById("wplus").onclick = () => resize(W + 1);
document.getElementById("undo").onclick = undo;
document.getElementById("save").onclick = save;
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
});

fetch("/asset?name=" + ASSET).then(r => r.json()).then(d => {
  W = d.w; H = d.h; cells = d.cells; palette = d.palette; colourButtons(); drawGrid();
});
</script>
</body></html>
